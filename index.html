<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AttendEase | SRKR Engineering College - Permission Portal</title>
    <meta name="description" content="Redesigned student home and attendance permission portal for SRKR Engineering College (CSD & CSIT). Fast, accessible, and responsive." />
    <link rel="icon" type="image/png" href="/attendease-logo.png" />
    <!-- Google Fonts: Outfit (headings) & Figtree (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Immediate theme application before React renders to prevent flash -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--color-canvas)] text-[var(--color-ink)] font-sans antialiased selection:bg-[#f26a0f]/20 selection:text-[#f26a0f]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
